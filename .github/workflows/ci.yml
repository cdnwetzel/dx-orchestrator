name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      # The suite is hermetic: it runs against the synthetic fixtures in
      # tests/fixtures and never needs the private sibling repos
      # (claude-sdlc-roles, devswarm-ledger) or a GPG keyring.
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          dx --version
          dx roles list --path tests/fixtures/roles
          dx roles list --path tests/fixtures/roles --json > /dev/null

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: LICENSE must ship in the wheel
        run: python -c "
          import glob, zipfile, sys;
          wheel = glob.glob('dist/*.whl')[0];
          names = zipfile.ZipFile(wheel).namelist();
          sys.exit(0 if any(n.endswith('LICENSE') for n in names) else 'LICENSE missing from wheel')
          "
